<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cackle.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cackle — events and ticketing that works even when the gate has no internet." />
    <!-- INK, the brand's third colour: hsl(260 18% 9%) as index.css declares
         it, which paints as #16131B. This is the browser chrome's colour on
         Android and in installed-PWA title bars, so it has to BE the app's
         ground rather than a near-black that is merely close to it. -->
    <meta name="theme-color" content="#16131b" />
    <title>Cackle — events &amp; ticketing that works offline</title>

    <!-- Social preview card. Text-only (summary): no dedicated OG image asset
         ships, so a shared link renders title + description over the icon. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cackle" />
    <meta property="og:title" content="Cackle — events &amp; ticketing that works offline" />
    <meta property="og:description" content="Events and ticketing that works even when the gate has no internet." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cackle — events &amp; ticketing that works offline" />
    <meta name="twitter:description" content="Events and ticketing that works even when the gate has no internet." />

    <!-- Self-hosted Figtree, preloaded so the display type doesn't wait on
         CSS discovery — no external host involved, so this stays inside the
         strict script-src/style-src 'self' CSP and works fully offline. -->
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <!-- Matches the --background token in index.css exactly, in both themes,
         so the first paint (before the stylesheet + ThemeProvider apply) is
         not a flash of a colour the app never uses. Light is WHITE; dark is
         INK, hsl(260 18% 9%) = #16131B. If index.css's --background moves,
         these move with it. -->
    <style>
        html, body { background-color: #ffffff; }
        @media (prefers-color-scheme: dark) {
            html, body { background-color: #16131b; }
        }
    </style>
</head>
<body>
    <div id="root" class="font-sans antialiased"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
