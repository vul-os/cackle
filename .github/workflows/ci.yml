# .github/workflows/ci.yml — build, test, vet, lint and boot-check Cackle.
#
# House rule: a green build proves nothing about whether the app RUNS.
# Sibling repos (diwan, wede) shipped blank screens behind green builds
# because nothing ever loaded the bundle in a real browser. The `boot` job
# below builds the REAL single-binary artifact (frontend embedded) and points
# headless Chromium at it, failing on any uncaught exception or empty #root.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  # ── Go backend ────────────────────────────────────────────────────────────
  go:
    name: Go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'  # latest 1.25.x patch — auto-picks stdlib security fixes
          cache: true

      # Scoped patterns — NEVER bare `./...`: web/node_modules can (and does)
      # ship stray *.go files from npm packages (e.g. `flatted`'s golang/
      # port), which a bare `./...` would try to build/vet/test.
      - name: Build
        run: go build ./cmd/... ./internal/...

      # Scoped to the real Go trees for the same reason as everything else in
      # this job — `gofmt -l .` would walk web/node_modules.
      - name: Gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ./cmd ./internal"
            exit 1
          fi

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Test
        run: go test ./cmd/... ./internal/...

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The docs viewer (site/docs.html) serves its own copy of every chapter
      # from site/docs/. Fail if docs/ was edited without re-running the mirror,
      # so the published docs can't silently drift from the repo. Deterministic
      # (a plain file copy), so a hard gate — no deps, just node built-ins.
      - name: Docs mirror in sync (docs/ -> site/docs/)
        run: node scripts/sync-docs.mjs --check

      # Every relative documentation link must resolve — as GitHub renders
      # the repo, as site/docs.html serves the flat mirror, and as a reader
      # follows a "see SOMETHING.md" from a source comment. Nothing checked
      # these before, and several were dead. No deps, just node built-ins.
      - name: Docs links resolve
        run: node scripts/check-doc-links.mjs

      # The same standard check-site.mjs holds site/ to, applied to the copy
      # that actually ships inside the binary. site/ has carried this check
      # since day one; web/src/ was gated by nothing, and a fabricated pricing
      # page — an invented "our fee", a competitive superlative, one processor
      # named as the default — lived there for months beside a landing page
      # that got every claim right. Source-text only, no browser, no deps.
      # (check-site.mjs itself needs a real browser — see the `site` job
      # below, where it actually runs.)
      - name: App copy states its limits and invents nothing
        run: node scripts/check-app.mjs

      - name: Install
        working-directory: web
        run: npm ci

      # vite build (below) strips types without checking them, so a green
      # build proves the bundle emits, not that the code typechecks. This
      # runs the real compiler in --noEmit mode as a hard gate — no
      # continue-on-error, no loosened tsconfig.
      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      # check:lint-config below is itself the gate that proves the lint config
      # is genuinely type-aware — but the gate script was unchecked JavaScript.
      # scripts/tsconfig.json (allowJs+checkJs+strict) type-checks it via JSDoc
      # without dragging script files into the app's own tsconfig.json/build
      # surface. BLOCKING: an unwired typecheck cannot fail a build, which is the
      # same hollow-gate shape this file's other steps exist to catch.
      - name: Typecheck CI scripts (check-lint-config.mjs)
        working-directory: web
        run: npm run typecheck:scripts

      - name: Lint
        working-directory: web
        run: npm run lint

      # A green lint above proves nothing about whether type-aware rules are
      # actually wired up (see the script's own header for the two real
      # failures this caught fleet-wide) — this runs the real tools and
      # checks what they did, not what the config file merely says.
      - name: Lint config actually does what it claims
        working-directory: web
        run: npm run check:lint-config

      # The browser ticket verifier is a second implementation of the wire
      # format in docs/TICKET-FORMAT.md, and it is the one that actually runs
      # at a gate. It is held to the same frozen corpus as the Go verifier
      # (docs/ticket-format-vectors.json) so the two cannot drift into
      # disagreeing about whether a ticket is admissible. node:test, no extra
      # dependency — see web/src/lib/capability.conformance.test.js.
      - name: Test (ticket-format conformance vectors)
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ── Docker image build (proves the Dockerfile itself works) ─────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/vul-os/cackle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Boot guard: build the real binary and load it in real Chromium ──────────
  boot:
    name: Boot guard (real Chromium, --demo)
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'  # latest 1.25.x patch — auto-picks stdlib security fixes
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root devDependencies (playwright)
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      # THIRD-PARTY-NOTICES.txt is regenerated from the real Go module graph
      # (needs `go`) and the real npm graph under web/ (needs web/node_modules,
      # already installed by the frontend build above) — this is the one job
      # that already has both toolchains warm, so the check lives here rather
      # than costing its own job/setup steps. Legal-compliance artifact: add a
      # dependency and it silently stops matching what's actually redistributed
      # unless something diffs it against the real graph. --check regenerates
      # into a scratch dir and diffs; it never writes THIRD-PARTY-NOTICES.txt.
      - name: Third-party notices match the actual dependency graph
        run: npm run notices:check

      # Mirrors `make build`: copy the built SPA where the embed_frontend
      # build tag expects it, build the real single binary, clean up the copy.
      - name: Build cackle (frontend embedded)
        run: |
          rm -rf cmd/cackle/dist
          cp -r web/dist cmd/cackle/dist
          CGO_ENABLED=0 go build -tags embed_frontend -o cackle ./cmd/cackle
          rm -rf cmd/cackle/dist

      - name: Boot check — fail on uncaught exception or empty #root
        run: node scripts/boot-check.mjs --bin ./cackle --port 8089

  # ── Site guard: real Chromium against site/ (the marketing + docs pages) ────
  # check-site.mjs has existed since site/ did — as `make site-guards` and as
  # the `site:check` npm script — but nothing in this file ever called either
  # one. ci.yml:84's comment above talked about what check-site.mjs holds
  # site/ to; it never ran it. That's the same "prints ok, never executes"
  # shape every other gate in this repo has been hardened against, just one
  # level up, at the wiring. site/ is committed static HTML/CSS/JS, not a
  # build product of web/ or cmd/, so this job needs neither Go nor the
  # frontend build and stands on its own rather than trailing the go/frontend
  # jobs — same pattern as verify-script below.
  site:
    name: Site guard (real Chromium, site/ pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root devDependencies (playwright)
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Loads both pages (index.html + docs.html) at both path shapes in a
      # real browser, proves they fetch nothing off-origin, never scroll
      # sideways (measured per element, not from the root — see the file's
      # own header comment for why that distinction is load-bearing), and
      # refuses any copy that upgrades "detected" into "prevented" for
      # cross-gate double-scan. Every detector proves it can fail before it is
      # trusted to pass — see claimGateSelfTest/overflowGateSelfTest in the
      # script itself.
      - name: site/ loads clean, self-contained, no overflow, no overclaim
        run: node scripts/check-site.mjs

  # A checksum guard that has quietly stopped failing is indistinguishable,
  # from a green CI run, from one that works. So verify.sh's refusals are
  # exercised on every push — not "does the script parse", but "does it still
  # REFUSE, with its own exit code and its own diagnostic, on each way a
  # release can be broken".
  verify-script:
    name: Release verifier — lint & failure matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # 24 synthetic-origin cases, each broken in exactly one way. Asserts the
      # exit code AND that a diagnostic was printed, because "aborted with no
      # message" was the real bug class in the sibling installers.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest
