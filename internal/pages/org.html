{{- /*
The organisation page template.

It follows the same five rules page.html follows, and a reviewer should check
it still follows them:

  1. NO <script>, anywhere, of any kind. The page has no behaviour.
  2. NO reference to any origin but this one. No <link rel=stylesheet>, no
     webfont, no analytics beacon, no remote image. This page has no
     subresources at all — not even /media — so the only bytes a browser
     fetches for it are the ones in the response.
  3. Every value is a plain {{ pipeline }} in its real context. There is no
     template.HTML/CSS/URL cast in internal/pages, so html/template's
     contextual escaper applies to all of them without exception.
  4. NO inline style="" attribute. Every declaration lives in the single
     nonce-carrying <style> element below, so the response's CSP can be
     style-src 'nonce-...' with no 'unsafe-inline' at all.
  5. No logic beyond ranging and branching on booleans already decided in Go
     (see org.go's orgView).

Unlike page.html there is no host theming here: an organisation page is
Cackle's own chrome, not a document somebody submitted, so no colour, font or
label on it comes from user input. The CSS below therefore contains no
{{pipeline}} at all, which is the strongest possible form of rule 3.

The palette is the brand's three colours — RED #FF4848, WHITE, INK #14121A —
with the measured contrast pairs asserted by TestOrgPage_ContrastMeetsWCAG_AA
in org_test.go rather than claimed in a comment here.
*/ -}}
<!doctype html>
<html lang="en" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Name}}</title>
<style nonce="{{.Nonce}}">
:root {
  --op-bg: #ffffff;
  --op-sunken: #f7f3ee;
  --op-surface: #ffffff;
  --op-text: #14121a;
  --op-muted: #6b6470;
  --op-line: #e5ded5;
  --op-link: #c42323;
  --op-rule: #ff4848;
  --op-radius: 10px;
  --op-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --op-bg: #14121a;
    --op-sunken: #14121a;
    --op-surface: #1d1a25;
    --op-text: #ffffff;
    --op-muted: #a9a2b4;
    --op-line: #2a2633;
    --op-link: #ff4848;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 0;
  background: var(--op-bg);
  color: var(--op-text);
  font-family: var(--op-font);
  font-size: 17px;
  line-height: 1.6;
}
.wrap { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
header.masthead { margin-bottom: 2.25rem; }
h1 { font-size: clamp(1.9rem, 5vw, 2.75rem); line-height: 1.15; margin: 0 0 .5rem; letter-spacing: -0.02em; overflow-wrap: break-word; }
h2 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 1rem; }
h3 { font-size: 1.15rem; line-height: 1.3; margin: 0 0 .35rem; overflow-wrap: break-word; }
p { margin: 0 0 1rem; overflow-wrap: break-word; }
.intro { color: var(--op-muted); font-size: 1.125rem; margin: 0; }
{{/* The ticket-stub perforation: the product's own motif, in brand red. */}}
.perf { border: 0; border-top: 2px dashed var(--op-rule); opacity: .55; margin: 1.75rem 0 2rem; }

ul.programme { list-style: none; margin: 0; padding: 0; display: grid; gap: .85rem; }
{{/* The whole row is the link. Padding alone puts it well past the 44px
     minimum target height on every viewport, with no fixed height to fight
     a long title wrapping to three lines at 390px. */}}
ul.programme a {
  display: block;
  padding: 1rem 1.15rem;
  background: var(--op-surface);
  border: 1px solid var(--op-line);
  border-radius: var(--op-radius);
  color: inherit;
  text-decoration: none;
}
ul.programme a:hover, ul.programme a:focus-visible { border-color: var(--op-link); }
ul.programme a:focus-visible { outline: 2px solid var(--op-link); outline-offset: 2px; }
.meta { color: var(--op-muted); font-size: .9rem; margin: 0; }
.meta .zone { font-size: .85em; }
.blurb { color: var(--op-muted); font-size: .95rem; margin: .4rem 0 0; }
.go { color: var(--op-link); font-size: .9rem; margin: .5rem 0 0; font-weight: 600; }
.vacant {
  background: var(--op-sunken);
  border: 1px solid var(--op-line);
  border-radius: var(--op-radius);
  padding: 1.5rem 1.25rem;
}
.vacant h2 { margin-bottom: .4rem; }
.vacant p { color: var(--op-muted); margin: 0; }
footer.colophon { margin-top: 3rem; color: var(--op-muted); font-size: .85rem; }
footer.colophon a { color: var(--op-link); }
@media (max-width: 26rem) {
  .wrap { padding-left: 1rem; padding-right: 1rem; }
}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <h1>{{.Name}}</h1>
  <p class="intro">{{.Intro}}</p>
</header>

<hr class="perf">

{{if .Empty}}
<div class="vacant">
  <h2>Nothing on sale right now</h2>
  <p>{{.Vacant}}</p>
</div>
{{else}}
<h2>What&rsquo;s on</h2>
<ul class="programme">
  {{- range .Events}}
  <li>
    <a href="{{.Href}}">
      <h3>{{.Title}}</h3>
      {{- if .When.Known}}
      <p class="meta">
        <time datetime="{{.When.StartISO}}">{{.When.StartText}}</time>
        {{- if .When.EndText}} &ndash; <time datetime="{{.When.EndISO}}">{{.When.EndText}}</time>{{end}}
        <span class="zone">{{.When.ZoneText}}</span>
        {{- if .Venue}} &middot; {{.Venue}}{{end}}
      </p>
      {{- else if .Venue}}
      <p class="meta">{{.Venue}}</p>
      {{- end}}
      {{- if .Summary}}
      <p class="blurb">{{.Summary}}</p>
      {{- end}}
      <p class="go">See this event &rarr;</p>
    </a>
  </li>
  {{- end}}
</ul>
{{end}}

<footer class="colophon">
  <p>{{.Name}}</p>
</footer>

</div>
</body>
</html>
